# nginx vhost for the Bonjou web relay.
#
# Runs on its own hostname so it never interferes with anything else
# already served from this box. Certbot appends the TLS directives on
# first issuance.
#
# The buffering settings below are not optional. With request buffering
# left on, nginx writes each entire upload to disk before forwarding it,
# which turns a relay that is supposed to store nothing into one that
# spools every file through /var/lib/nginx and eventually fills the disk.

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOSTNAME;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name RELAY_HOSTNAME;

    # Transfers are streamed, never spooled. Both directions matter:
    # request buffering would spool uploads to disk, response buffering
    # would break streaming to the receiver.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # A multi-gigabyte transfer can legitimately hold one request open for
    # a long time. The relay's own idle watchdog bounds stalled transfers.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Control plane: WebSocket upgrade.
    location /ws {
        proxy_pass http://127.0.0.1:46330;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Data plane: chunked uploads and the streaming download.
    location /t/ {
        proxy_pass http://127.0.0.1:46330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:46330;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
